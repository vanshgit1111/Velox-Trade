<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Velox Trade - Real-time stock market dashboard with live prices, news, and watchlist">
    <title>Velox Trade</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <span class="title">Velox Trade</span>
        <button id="mode-btn">Dark Mode</button>
    </div>

    <div class="filters">
        <input type="text" id="search-box" placeholder="Search stocks...">
        <select id="sector-dropdown">
            <option value="All">All Sectors</option>
            <option value="IT">IT</option>
            <option value="Energy">Energy</option>
            <option value="Banking">Banking</option>
        </select>
        <select id="sort-dropdown">
            <option value="name">Sort by Name</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
        </select>
    </div>

    <div class="main-area">
        <div class="sidebar">
            <div class="box">
                <h3>Market Mood</h3>
                <canvas id="mood-chart" width="200" height="150"></canvas>
                <h2 id="mood-text" style="text-align:center;">Loading...</h2>
            </div>

            <div class="box">
                <h3>News</h3>
                <div id="news-list"></div>
            </div>

            <div class="box">
                <h3>My Watchlist</h3>
                <h4 id="total-value">Portfolio Value: ₹0.00</h4>
                <div id="watchlist-area"></div>
            </div>
        </div>

        <div class="content">
            <div id="cards-container" class="cards"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
